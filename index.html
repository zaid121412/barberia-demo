
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Barbería Demo</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
    }
    header {
      padding: 55px 20px;
      background: #202020;
    }
    h1 { color: #e5bd70; }
    section { padding: 25px 20px; }
    .servicio {
      margin: 12px auto;
      padding: 16px;
      max-width: 320px;
      border: 1px solid #555;
      border-radius: 10px;
    }
    a {
      display: inline-block;
      background: #e5bd70;
      color: #111;
      padding: 13px 20px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
    }
    footer { padding: 20px; color: #bbb; }
  </style>
</head>
<body>
  <header>
    <h1>BARBERÍA DEMO</h1>
    <p>Tu estilo, tu identidad.</p>
    <a href="#servicios">Ver servicios</a>
  </header>

  <section id="servicios">
    <h2>Servicios de ejemplo</h2>
    <div class="servicio">Corte clásico — $100</div>
    <div class="servicio">Degradado — $120</div>
    <div class="servicio">Corte y arreglo de barba — $160</div>
    <p>Precios ficticios para demostración.</p>
  </section>

  <section>
    <h2>Contacto</h2>
    <p>Agrega aquí el contacto autorizado del negocio real.</p>
  </section>

  <footer>
    Sitio de demostración creado para practicar.
  </footer>
</body>
</html>
